name: Mark the review guide outdated
description: Marks the review guide of a pull request as outdated after a push that started no new guide.

# Runs instead of the guide when a repository set `PITCREW_GUIDE_ON_PUSH=false`.
# No model, no checkout of the branch: it reads the pull request's comments,
# finds the guide this package wrote, and changes its heading and one line. See
# scripts/guide-outdated.mjs.

inputs:
  github-token:
    description: Token that may edit the pull request's comments.
    required: true
  pr-number:
    description: Pull request whose guide to mark. Defaults to the one in the triggering event.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # The script needs Node 20.10 or newer. A self-hosted runner may have none,
    # and then the step dies with `node: command not found`. The same check as
    # in actions/agent: a Node that is already there is kept.
    - name: Look for Node
      id: node
      shell: bash
      run: |
        set -euo pipefail
        if command -v node > /dev/null &&
          node -e 'const [major, minor] = process.versions.node.split(".").map(Number); process.exit(major > 20 || (major === 20 && minor >= 10) ? 0 : 1)'; then
          echo "Node $(node --version) at $(command -v node)"
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "No Node 20.10 or newer on PATH, installing one."
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install Node
      if: steps.node.outputs.found != 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        # No checkout in this job, so there is no package.json to key a cache on.
        package-manager-cache: false

    - name: Mark the guide outdated
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number || github.event.pull_request.number }}
        AFTER_SHA: ${{ github.event.pull_request.head.sha }}
        REVIEW_TITLE: Review guide
      run: node "$GITHUB_ACTION_PATH/../../scripts/guide-outdated.mjs"
