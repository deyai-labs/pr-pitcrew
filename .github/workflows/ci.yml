name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor stated in package.json and in the README, and the version
        # GitHub's runner image ships. Both, because the scripts run in whatever
        # Node the consumer's runner or container happens to have.
        node: ['20.10', '22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # No install step, because there is nothing to install. See package.json.
      - run: node --test
      - run: node scripts/check-syntax.mjs
      - run: node scripts/release.mjs --verify

  actionlint:
    name: Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The shell inside a `run:` block is a second language in a YAML file, and
      # nothing else here reads it. actionlint parses both, and shellcheck comes
      # with it.
      - name: Lint the workflows and the actions
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
